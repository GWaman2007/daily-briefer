[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-briefer"
version = "0.1.0"
description = "AI-powered, self-improving email news briefer with Tavily search"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "aiosmtplib>=3.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
daily-briefer = "daily_briefer.cli:cli"
