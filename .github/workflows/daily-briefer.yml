name: DailyBriefer

on:
  schedule:
    # Production Daily Brief Schedule at 23:30 UTC (5:00 AM IST)
    - cron: '30 23 * * *'
    # Production Reply Polling Schedule every 5 hours
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode for test run'
        required: false
        default: 'brief'
        type: choice
        options:
          - brief
          - auto
          - reply
          - once

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Determine Run Mode
        id: run_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            echo "MODE=brief" >> $GITHUB_ENV
          else
            echo "MODE=once" >> $GITHUB_ENV
          fi

      - name: Run DailyBriefer
        run: python -m daily_briefer.cli run --mode $MODE
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
